[package]
name = "simpa-core"
description = "Headless core: project model, solver input files, runs and results for I-Simpa's solvers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
roxmltree = "0.21.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1"
