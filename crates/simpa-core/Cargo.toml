[package]
name = "simpa-core"
description = "Headless core: project model, solver input files, runs and results for I-Simpa's solvers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
regex = "1.13.1"
robust = "1.2.0"
roxmltree = "0.21.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[features]
# Test builds only: lets a test put a fault into the code paths the M7 gates hold
# (src/faults.rs), so each gate's say-NO runs the fault through the code. No normal build has it.
fault-injection = []

[dev-dependencies]
proptest = "1"
# This crate's own tests build it with the fault seams (src/faults.rs).
simpa-core = { path = ".", features = ["fault-injection"] }
